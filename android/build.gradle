buildscript {
    ext.kotlin_version = '1.8.22' // Make sure this matches the version in your settings.gradle
    repositories {
        google() // Add Google's Maven repository
        mavenCentral() // Add Maven Central repository
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1' // Or your AGP version
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.3.15' // latest stable
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
